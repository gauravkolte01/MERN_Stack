<!DOCTYPE html>
<html>
<head>
    <title>Laundry Mart Login</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <img src="Laundry.jpg" alt="Laundry Image">
        </div>
        <div class="right">
            <h1>Hello Again!</h1>
            <p>Welcome back Please login to continue.</p>
            <form>
                <label>Email</label>
                <input type="email" placeholder="Email@site.com">
                <label>Password</label>
                <input type="password" placeholder="Password">
                <a href="#" class="forgot">Forgot Password</a>
                <button type="submit">Login</button>
                <p class="register">
                    Not a member? <a href="#">Register Now</a></p>
            </form>
        </div>
    </div>
</body>
</html>
